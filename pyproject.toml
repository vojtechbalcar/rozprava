[project]
name = "rozprava"
version = "0.1.0"
description = "Search what Czech MPs said in parliament."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "fonttools[woff]>=4.50",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch"]  # throwaway research scripts, like pyright's include list

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local migrations folder
