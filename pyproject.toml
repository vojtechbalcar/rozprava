[project]
name = "rozprava"
version = "0.1.0"
description = "Search what Czech MPs said in parliament."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
