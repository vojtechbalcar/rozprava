# Rozprava retrieval and summary evaluation set. See eval/README.md.
#
# Each question has graded judgments for speeches in the local archive,
# identified by catalog number (term-sitting-page-order, as in /projev/...).
#   grade 2: the speech answers the question directly
#   grade 1: related or partial; useful context for an answer
#   grade 0: judged NOT relevant although it looks relevant (a hard negative);
#            `note` says why, e.g. the speaker quotes or rebuts someone else
# `evidence` is a verbatim excerpt of the speech; scripts/evaluate.py check
# verifies it against the database. `filters` uses the /hledat URL parameters.
# `keywords` is what a person would type into today's keyword search.
# Judgments come from pooled keyword searches and are incomplete: an
# unjudged speech is unknown, not irrelevant.

version: 1
judged_on: 2026-11-19

questions:
  - id: q01
    question: Proč opozice v únoru 2026 navrhla vyslovit nedůvěru vládě Andreje Babiše?
    kind: event
    filters: {obdobi: [10], od: "2026-02-01", do: "2026-02-28"}
    keywords: nedůvěra vládě Macinka
    judgments:
      - speech: 10-008-0001-2
        grade: 2
        evidence: "Vydírání Petra Macinky je ta příčina, která nás přivedla dnes k jednání o nedůvěře vládě"
      - speech: 10-008-0055-4
        grade: 2
        evidence: "Jednání členů vlády vůči prezidentu republiky, ať už šlo o nátlak, vydírání nebo nepřijatelné politické hry, není nějakým osobním selháním jednoho ministra."
      - speech: 10-008-0053-2
        grade: 2
        evidence: "vláda se dopustila značné devalvace – a konkrétně tedy místopředseda vlády Macinka – značné devalvace toho, jak má fungovat ústavní činitel"
      - speech: 10-008-0115-2
        grade: 1
        evidence: "Tváří v tvář téhle situaci pan Macinka doslova píše:"
        note: Quotes Macinka's message; the quoted words are not the speaker's own.
      - speech: 10-008-0072-1
        grade: 1
        evidence: "situace, která se vyvinula mezi Hradem a panem ministrem Macinkou"
      - speech: 10-008-0009-2
        grade: 0
        evidence: "ten důvod dnešní schůze o nedůvěře tak, jak ho formulovala současná opozice, tedy bývalá Fialova vládní koalice, ten z mého pohledu nemá vůbec žádnou logiku"
        note: Coalition rebuttal by Tomio Okamura; characterises the opposition's reasons rather than giving them.
      - speech: 10-008-0045-1
        grade: 0
        evidence: "za mě je to devalvace toho institutu, návrh na vyslovení nedů"
        note: Coalition (ANO) rebuttal; argues the motion devalues the institution.

